<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0c0a09"/>
      <stop offset="50%" style="stop-color:#1c1917"/>
      <stop offset="100%" style="stop-color:#0c0a09"/>
    </linearGradient>
    <linearGradient id="modeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f97316"/>
      <stop offset="50%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#eab308"/>
    </linearGradient>
    <linearGradient id="snifferGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
    <linearGradient id="apGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#0ea5e9"/>
    </linearGradient>
    <linearGradient id="relayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#34d399"/>
    </linearGradient>
    <linearGradient id="routerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="cardShadow">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  
  <!-- Grid pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#44403c" stroke-width="0.5" opacity="0.3"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>
  
  <!-- Dashboard Window -->
  <g transform="translate(100, 80)" filter="url(#cardShadow)">
    <!-- Window frame -->
    <rect width="1000" height="470" rx="16" fill="#1c1917" stroke="#44403c" stroke-width="2"/>
    
    <!-- Title bar -->
    <rect width="1000" height="50" rx="16" fill="#292524"/>
    <rect y="35" width="1000" height="15" fill="#292524"/>
    
    <!-- Window controls -->
    <circle cx="28" cy="25" r="7" fill="#ef4444"/>
    <circle cx="52" cy="25" r="7" fill="#f59e0b"/>
    <circle cx="76" cy="25" r="7" fill="#22c55e"/>
    
    <!-- Title -->
    <text x="500" y="32" font-family="Inter, sans-serif" font-size="16" font-weight="600" fill="#fafaf9" text-anchor="middle">Network Modes Dashboard — OpenWrt Multi-Mode Configuration</text>
    
    <!-- Navigation tabs -->
    <g transform="translate(20, 60)">
      <rect width="100" height="32" rx="6" fill="url(#modeGrad)" opacity="0.2"/>
      <rect width="100" height="32" rx="6" fill="none" stroke="url(#modeGrad)" stroke-width="1"/>
      <text x="50" y="21" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#f97316" text-anchor="middle">Overview</text>
      
      <g transform="translate(110, 0)">
        <text x="40" y="21" font-family="Inter, sans-serif" font-size="12" fill="#a8a29e" text-anchor="middle">Sniffer</text>
      </g>
      <g transform="translate(190, 0)">
        <text x="50" y="21" font-family="Inter, sans-serif" font-size="12" fill="#a8a29e" text-anchor="middle">Access Point</text>
      </g>
      <g transform="translate(290, 0)">
        <text x="30" y="21" font-family="Inter, sans-serif" font-size="12" fill="#a8a29e" text-anchor="middle">Relay</text>
      </g>
      <g transform="translate(360, 0)">
        <text x="30" y="21" font-family="Inter, sans-serif" font-size="12" fill="#a8a29e" text-anchor="middle">Router</text>
      </g>
      
      <!-- Current mode badge -->
      <g transform="translate(800, 0)">
        <rect width="130" height="32" rx="16" fill="rgba(249, 115, 22, 0.15)" stroke="rgba(249, 115, 22, 0.3)" stroke-width="1"/>
        <circle cx="20" cy="16" r="5" fill="#f97316">
          <animate attributeName="opacity" values="1;0.5;1" dur="1.5s" repeatCount="indefinite"/>
        </circle>
        <text x="75" y="20" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#f97316" text-anchor="middle">Router Mode</text>
      </g>
    </g>
    
    <!-- Mode Cards Grid -->
    <g transform="translate(20, 110)">
      <!-- Sniffer Card -->
      <g transform="translate(0, 0)">
        <rect width="230" height="160" rx="12" fill="#292524" stroke="#44403c" stroke-width="1"/>
        <rect width="230" height="4" rx="2" fill="url(#snifferGrad)" opacity="0.7"/>
        <rect x="16" y="20" width="48" height="48" rx="12" fill="rgba(139, 92, 246, 0.2)" stroke="rgba(139, 92, 246, 0.3)" stroke-width="1"/>
        <text x="40" y="52" font-size="24" text-anchor="middle">🔍</text>
        <text x="80" y="38" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#fafaf9">Sniffer</text>
        <text x="80" y="54" font-family="Inter, sans-serif" font-size="11" fill="#78716c">Passthrough Mode</text>
        <text x="16" y="90" font-family="Inter, sans-serif" font-size="11" fill="#a8a29e">Transparent bridge for</text>
        <text x="16" y="105" font-family="Inter, sans-serif" font-size="11" fill="#a8a29e">network analysis</text>
        <!-- Features -->
        <g transform="translate(16, 120)">
          <rect width="45" height="20" rx="10" fill="#292524" stroke="#44403c" stroke-width="1"/>
          <text x="22" y="14" font-family="Inter, sans-serif" font-size="9" fill="#a8a29e" text-anchor="middle">No IP</text>
          <rect x="50" width="55" height="20" rx="10" fill="#292524" stroke="#44403c" stroke-width="1"/>
          <text x="77" y="14" font-family="Inter, sans-serif" font-size="9" fill="#a8a29e" text-anchor="middle">Netifyd</text>
          <rect x="110" width="55" height="20" rx="10" fill="#292524" stroke="#44403c" stroke-width="1"/>
          <text x="137" y="14" font-family="Inter, sans-serif" font-size="9" fill="#a8a29e" text-anchor="middle">Bridge</text>
        </g>
      </g>
      
      <!-- Access Point Card -->
      <g transform="translate(250, 0)">
        <rect width="230" height="160" rx="12" fill="#292524" stroke="#44403c" stroke-width="1"/>
        <rect width="230" height="4" rx="2" fill="url(#apGrad)" opacity="0.7"/>
        <rect x="16" y="20" width="48" height="48" rx="12" fill="rgba(6, 182, 212, 0.2)" stroke="rgba(6, 182, 212, 0.3)" stroke-width="1"/>
        <text x="40" y="52" font-size="24" text-anchor="middle">📶</text>
        <text x="80" y="38" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#fafaf9">Access Point</text>
        <text x="80" y="54" font-family="Inter, sans-serif" font-size="11" fill="#78716c">WiFi AP Mode</text>
        <text x="16" y="90" font-family="Inter, sans-serif" font-size="11" fill="#a8a29e">WiFi AP with 802.11r/k/v</text>
        <text x="16" y="105" font-family="Inter, sans-serif" font-size="11" fill="#a8a29e">roaming optimizations</text>
        <g transform="translate(16, 120)">
          <rect width="50" height="20" rx="10" fill="#292524" stroke="#44403c" stroke-width="1"/>
          <text x="25" y="14" font-family="Inter, sans-serif" font-size="9" fill="#a8a29e" text-anchor="middle">802.11r</text>
          <rect x="55" width="55" height="20" rx="10" fill="#292524" stroke="#44403c" stroke-width="1"/>
          <text x="82" y="14" font-family="Inter, sans-serif" font-size="9" fill="#a8a29e" text-anchor="middle">Steering</text>
          <rect x="115" width="60" height="20" rx="10" fill="#292524" stroke="#44403c" stroke-width="1"/>
          <text x="145" y="14" font-family="Inter, sans-serif" font-size="9" fill="#a8a29e" text-anchor="middle">Beamform</text>
        </g>
      </g>
      
      <!-- Relay Card -->
      <g transform="translate(500, 0)">
        <rect width="230" height="160" rx="12" fill="#292524" stroke="#44403c" stroke-width="1"/>
        <rect width="230" height="4" rx="2" fill="url(#relayGrad)" opacity="0.7"/>
        <rect x="16" y="20" width="48" height="48" rx="12" fill="rgba(16, 185, 129, 0.2)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1"/>
        <text x="40" y="52" font-size="24" text-anchor="middle">🔄</text>
        <text x="80" y="38" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#fafaf9">Relay</text>
        <text x="80" y="54" font-family="Inter, sans-serif" font-size="11" fill="#78716c">Extender Mode</text>
        <text x="16" y="90" font-family="Inter, sans-serif" font-size="11" fill="#a8a29e">Network relay with</text>
        <text x="16" y="105" font-family="Inter, sans-serif" font-size="11" fill="#a8a29e">WireGuard optimization</text>
        <g transform="translate(16, 120)">
          <rect width="55" height="20" rx="10" fill="#292524" stroke="#44403c" stroke-width="1"/>
          <text x="27" y="14" font-family="Inter, sans-serif" font-size="9" fill="#a8a29e" text-anchor="middle">WireGuard</text>
          <rect x="60" width="40" height="20" rx="10" fill="#292524" stroke="#44403c" stroke-width="1"/>
          <text x="80" y="14" font-family="Inter, sans-serif" font-size="9" fill="#a8a29e" text-anchor="middle">MTU</text>
          <rect x="105" width="40" height="20" rx="10" fill="#292524" stroke="#44403c" stroke-width="1"/>
          <text x="125" y="14" font-family="Inter, sans-serif" font-size="9" fill="#a8a29e" text-anchor="middle">MSS</text>
        </g>
      </g>
      
      <!-- Router Card (Active) -->
      <g transform="translate(750, 0)">
        <rect width="230" height="160" rx="12" fill="#292524" stroke="#f97316" stroke-width="2">
          <animate attributeName="stroke-opacity" values="1;0.5;1" dur="3s" repeatCount="indefinite"/>
        </rect>
        <rect width="230" height="4" rx="2" fill="url(#routerGrad)"/>
        <!-- Active badge -->
        <rect x="155" y="12" width="60" height="22" rx="11" fill="#f97316"/>
        <text x="185" y="27" font-family="Inter, sans-serif" font-size="9" font-weight="700" fill="white" text-anchor="middle">ACTIVE</text>
        <rect x="16" y="20" width="48" height="48" rx="12" fill="url(#routerGrad)"/>
        <text x="40" y="52" font-size="24" text-anchor="middle">🌐</text>
        <text x="80" y="38" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#fafaf9">Router</text>
        <text x="80" y="54" font-family="Inter, sans-serif" font-size="11" fill="#78716c">Full Router Mode</text>
        <text x="16" y="90" font-family="Inter, sans-serif" font-size="11" fill="#a8a29e">WAN, NAT, Firewall,</text>
        <text x="16" y="105" font-family="Inter, sans-serif" font-size="11" fill="#a8a29e">Proxy &amp; HTTPS Frontend</text>
        <g transform="translate(16, 120)">
          <rect width="35" height="20" rx="10" fill="#292524" stroke="#44403c" stroke-width="1"/>
          <text x="17" y="14" font-family="Inter, sans-serif" font-size="9" fill="#a8a29e" text-anchor="middle">NAT</text>
          <rect x="40" width="45" height="20" rx="10" fill="#292524" stroke="#44403c" stroke-width="1"/>
          <text x="62" y="14" font-family="Inter, sans-serif" font-size="9" fill="#a8a29e" text-anchor="middle">Proxy</text>
          <rect x="90" width="50" height="20" rx="10" fill="#292524" stroke="#44403c" stroke-width="1"/>
          <text x="115" y="14" font-family="Inter, sans-serif" font-size="9" fill="#a8a29e" text-anchor="middle">HTTPS</text>
          <rect x="145" width="50" height="20" rx="10" fill="#292524" stroke="#44403c" stroke-width="1"/>
          <text x="170" y="14" font-family="Inter, sans-serif" font-size="9" fill="#a8a29e" text-anchor="middle">Nginx</text>
        </g>
      </g>
    </g>
    
    <!-- Interface Status Section -->
    <g transform="translate(20, 290)">
      <rect width="480" height="160" rx="12" fill="#292524" stroke="#44403c" stroke-width="1"/>
      <text x="20" y="30" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#fafaf9">🔌 Network Interfaces</text>
      <text x="400" y="30" font-family="JetBrains Mono, monospace" font-size="11" fill="#f97316">6 interfaces</text>
      
      <!-- Interface cards -->
      <g transform="translate(16, 45)">
        <rect width="140" height="50" rx="8" fill="#1c1917" stroke="#44403c" stroke-width="1"/>
        <text x="40" y="25" font-size="16" text-anchor="middle">🔗</text>
        <text x="60" y="22" font-family="JetBrains Mono, monospace" font-size="11" font-weight="600" fill="#fafaf9">eth0</text>
        <text x="60" y="36" font-family="JetBrains Mono, monospace" font-size="9" fill="#78716c">192.168.1.1</text>
        <circle cx="125" cy="25" r="5" fill="#22c55e"/>
      </g>
      <g transform="translate(166, 45)">
        <rect width="140" height="50" rx="8" fill="#1c1917" stroke="#44403c" stroke-width="1"/>
        <text x="40" y="25" font-size="16" text-anchor="middle">🌍</text>
        <text x="60" y="22" font-family="JetBrains Mono, monospace" font-size="11" font-weight="600" fill="#fafaf9">eth1</text>
        <text x="60" y="36" font-family="JetBrains Mono, monospace" font-size="9" fill="#78716c">DHCP</text>
        <circle cx="125" cy="25" r="5" fill="#22c55e"/>
      </g>
      <g transform="translate(316, 45)">
        <rect width="140" height="50" rx="8" fill="#1c1917" stroke="#44403c" stroke-width="1"/>
        <text x="40" y="25" font-size="16" text-anchor="middle">📶</text>
        <text x="60" y="22" font-family="JetBrains Mono, monospace" font-size="11" font-weight="600" fill="#fafaf9">wlan0</text>
        <text x="60" y="36" font-family="JetBrains Mono, monospace" font-size="9" fill="#78716c">AP Mode</text>
        <circle cx="125" cy="25" r="5" fill="#22c55e"/>
      </g>
      <g transform="translate(16, 105)">
        <rect width="140" height="50" rx="8" fill="#1c1917" stroke="#44403c" stroke-width="1"/>
        <text x="40" y="25" font-size="16" text-anchor="middle">🔐</text>
        <text x="60" y="22" font-family="JetBrains Mono, monospace" font-size="11" font-weight="600" fill="#fafaf9">wg0</text>
        <text x="60" y="36" font-family="JetBrains Mono, monospace" font-size="9" fill="#78716c">10.0.0.1</text>
        <circle cx="125" cy="25" r="5" fill="#22c55e"/>
      </g>
      <g transform="translate(166, 105)">
        <rect width="140" height="50" rx="8" fill="#1c1917" stroke="#44403c" stroke-width="1"/>
        <text x="40" y="25" font-size="16" text-anchor="middle">🌉</text>
        <text x="60" y="22" font-family="JetBrains Mono, monospace" font-size="11" font-weight="600" fill="#fafaf9">br-lan</text>
        <text x="60" y="36" font-family="JetBrains Mono, monospace" font-size="9" fill="#78716c">192.168.1.1</text>
        <circle cx="125" cy="25" r="5" fill="#22c55e"/>
      </g>
      <g transform="translate(316, 105)">
        <rect width="140" height="50" rx="8" fill="#1c1917" stroke="#44403c" stroke-width="1"/>
        <text x="40" y="25" font-size="16" text-anchor="middle">🔐</text>
        <text x="60" y="22" font-family="JetBrains Mono, monospace" font-size="11" font-weight="600" fill="#fafaf9">wg1</text>
        <text x="60" y="36" font-family="JetBrains Mono, monospace" font-size="9" fill="#78716c">Stopped</text>
        <circle cx="125" cy="25" r="5" fill="#ef4444"/>
      </g>
    </g>
    
    <!-- Services Status -->
    <g transform="translate(520, 290)">
      <rect width="460" height="160" rx="12" fill="#292524" stroke="#44403c" stroke-width="1"/>
      <text x="20" y="30" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#fafaf9">🔧 Services Status</text>
      
      <g transform="translate(16, 45)">
        <rect width="135" height="50" rx="8" fill="#1c1917" stroke="#44403c" stroke-width="1"/>
        <text x="25" y="30" font-size="20">🛡️</text>
        <text x="50" y="25" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#fafaf9">Firewall</text>
        <text x="50" y="40" font-family="Inter, sans-serif" font-size="10" fill="#22c55e">Running</text>
        <circle cx="120" cy="25" r="5" fill="#22c55e"/>
      </g>
      <g transform="translate(161, 45)">
        <rect width="135" height="50" rx="8" fill="#1c1917" stroke="#44403c" stroke-width="1"/>
        <text x="25" y="30" font-size="20">📡</text>
        <text x="50" y="25" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#fafaf9">DHCP/DNS</text>
        <text x="50" y="40" font-family="Inter, sans-serif" font-size="10" fill="#22c55e">Running</text>
        <circle cx="120" cy="25" r="5" fill="#22c55e"/>
      </g>
      <g transform="translate(306, 45)">
        <rect width="135" height="50" rx="8" fill="#1c1917" stroke="#44403c" stroke-width="1"/>
        <text x="25" y="30" font-size="20">🌐</text>
        <text x="50" y="25" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#fafaf9">Nginx</text>
        <text x="50" y="40" font-family="Inter, sans-serif" font-size="10" fill="#22c55e">Running</text>
        <circle cx="120" cy="25" r="5" fill="#22c55e"/>
      </g>
      <g transform="translate(16, 105)">
        <rect width="135" height="50" rx="8" fill="#1c1917" stroke="#44403c" stroke-width="1"/>
        <text x="25" y="30" font-size="20">🔐</text>
        <text x="50" y="25" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#fafaf9">WireGuard</text>
        <text x="50" y="40" font-family="Inter, sans-serif" font-size="10" fill="#22c55e">Running</text>
        <circle cx="120" cy="25" r="5" fill="#22c55e"/>
      </g>
      <g transform="translate(161, 105)">
        <rect width="135" height="50" rx="8" fill="#1c1917" stroke="#44403c" stroke-width="1"/>
        <text x="25" y="30" font-size="20">🦑</text>
        <text x="50" y="25" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#fafaf9">Squid</text>
        <text x="50" y="40" font-family="Inter, sans-serif" font-size="10" fill="#78716c">Stopped</text>
        <circle cx="120" cy="25" r="5" fill="#ef4444"/>
      </g>
      <g transform="translate(306, 105)">
        <rect width="135" height="50" rx="8" fill="#1c1917" stroke="#44403c" stroke-width="1"/>
        <text x="25" y="30" font-size="20">🔍</text>
        <text x="50" y="25" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#fafaf9">Netifyd</text>
        <text x="50" y="40" font-family="Inter, sans-serif" font-size="10" fill="#78716c">Stopped</text>
        <circle cx="120" cy="25" r="5" fill="#ef4444"/>
      </g>
    </g>
  </g>
  
  <!-- Floating decorative elements -->
  <g filter="url(#glow)">
    <circle cx="60" cy="100" r="30" fill="url(#modeGrad)" opacity="0.15">
      <animate attributeName="r" values="30;35;30" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1140" cy="530" r="40" fill="url(#snifferGrad)" opacity="0.1">
      <animate attributeName="r" values="40;45;40" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1100" cy="100" r="25" fill="url(#apGrad)" opacity="0.12">
      <animate attributeName="r" values="25;30;25" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
