<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-icieb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0a10"/>
      <stop offset="100%" stop-color="#000"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg-icieb)"/>
  
  <!-- Subtle grid -->
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M30 0L0 0 0 30" fill="none" stroke="#ff6699" stroke-width="0.2" opacity="0.1"/>
  </pattern>
  <rect width="100%" height="100%" fill="url(#grid)"/>
  
  <!-- Top accent -->
  <rect x="0" y="0" width="100%" height="3" fill="#ff6699" opacity="0.8"/>
  
  <!-- Left side info -->
  <circle cx="60" cy="120" r="40" fill="#1a0a10" stroke="#ff6699" stroke-width="2"/>
  <text x="60" y="130" font-size="28" text-anchor="middle" fill="#ff6699">🌸</text>
  
  <text x="25" y="200" font-family="'JetBrains Mono',monospace" font-size="28" font-weight="bold" fill="#ff6699">ICIEB</text>
  <text x="25" y="230" font-family="system-ui,sans-serif" font-size="12" fill="#888">Boutique Gravure Laser • 2018-2021</text>
  
  <!-- Browser window -->
  <g filter="url(#shadow)">
    <!-- Window frame -->
    <rect x="380" y="50" width="400" height="300" rx="8" fill="#1a1a1a" stroke="#ff6699" stroke-width="1" opacity="0.9"/>
    
    <!-- Title bar -->
    <rect x="380" y="50" width="400" height="25" rx="8" fill="#2a2a2a"/>
    <rect x="380" y="67" width="400" height="8" fill="#2a2a2a"/>
    
    <!-- Window buttons -->
    <circle cx="395" cy="62" r="5" fill="#ff5f56"/>
    <circle cx="412" cy="62" r="5" fill="#ffbd2e"/>
    <circle cx="429" cy="62" r="5" fill="#27c93f"/>
    
    <!-- URL bar -->
    <rect x="445" y="55" width="320" height="15" rx="3" fill="#1a1a1a"/>
    <text x="455" y="65" font-family="monospace" font-size="8" fill="#666">https://icieb.fr</text>
    
    <!-- Content area -->
    <rect x="380" y="75" width="400" height="275" fill="#1a0a10"/>
    
    <!-- Content -->
    <rect x="385" y="73" width="390" height="18" fill="#ff6699" opacity="0.15"/>
    <text x="395" y="85" font-family="sans-serif" font-size="10" fill="#ff6699" font-weight="bold">ICIEB - Boutique</text>
    <text x="395" y="105" font-family="sans-serif" font-size="6" fill="#666">Accueil > Gravure Laser > Géométrie</text>
    <rect x="395" y="107" width="70" height="50" rx="3" fill="#1a1a1a" stroke="#333" stroke-width="0.5"/>
    <text x="430" y="127" font-size="18" text-anchor="middle" fill="#ff6699">✿</text>
    <text x="430" y="145" font-family="sans-serif" font-size="6" text-anchor="middle" fill="#ccc">Fleur de Vie</text>
    <text x="430" y="155" font-family="monospace" font-size="7" text-anchor="middle" fill="#ff6699" font-weight="bold">29,90€</text>
    <rect x="475" y="107" width="70" height="50" rx="3" fill="#1a1a1a" stroke="#333" stroke-width="0.5"/>
    <text x="510" y="127" font-size="18" text-anchor="middle" fill="#ff6699">◎</text>
    <text x="510" y="145" font-family="sans-serif" font-size="6" text-anchor="middle" fill="#ccc">Crop Circle</text>
    <text x="510" y="155" font-family="monospace" font-size="7" text-anchor="middle" fill="#ff6699" font-weight="bold">34,90€</text>
    <rect x="555" y="107" width="70" height="50" rx="3" fill="#1a1a1a" stroke="#333" stroke-width="0.5"/>
    <text x="590" y="127" font-size="18" text-anchor="middle" fill="#ff6699">✡</text>
    <text x="590" y="145" font-family="sans-serif" font-size="6" text-anchor="middle" fill="#ccc">Métatron</text>
    <text x="590" y="155" font-family="monospace" font-size="7" text-anchor="middle" fill="#ff6699" font-weight="bold">39,90€</text>
    <text x="555" y="172" font-family="monospace" font-size="7" fill="#888">Gravure laser haute précision sur bois</text>
    <text x="555" y="184" font-family="monospace" font-size="7" fill="#888">Fait main • Pièces uniques</text>
  </g>
  
  <!-- Year badge -->
  <rect x="700" y="15" width="85" height="24" rx="4" fill="#ff6699" opacity="0.15"/>
  <rect x="700" y="15" width="85" height="24" rx="4" fill="none" stroke="#ff6699" stroke-width="1" opacity="0.4"/>
  <text x="743" y="32" font-family="monospace" font-size="10" text-anchor="middle" fill="#ff6699">ARCHIVED</text>
  
  <!-- Bottom bar -->
  <rect x="0" y="415" width="100%" height="35" fill="#0a0a0a"/>
  <text x="15" y="438" font-family="monospace" font-size="11" fill="#ff6699" opacity="0.7">cybermind.fr/portfolio/icieb</text>
  <text x="785" y="438" font-family="monospace" font-size="9" text-anchor="end" fill="#444">SNAPSHOT</text>
</svg>