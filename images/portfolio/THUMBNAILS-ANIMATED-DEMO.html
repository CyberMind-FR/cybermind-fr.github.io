<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Thumbnails Animés - CyberMind</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-card: #1a1a24;
            --text-primary: #e0e0e0;
            --text-secondary: #888;
            --accent: #00ff88;
            --accent-purple: #9966ff;
            --accent-pink: #ff6699;
            --accent-gold: #ffcc00;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'JetBrains Mono', monospace;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        /* Animated background */
        .bg-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(0,255,136,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,255,136,0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: 0;
        }
        
        .container {
            position: relative;
            z-index: 1;
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }
        
        header {
            text-align: center;
            margin-bottom: 3rem;
            padding: 2rem 0;
        }
        
        h1 {
            font-size: 2.5rem;
            color: var(--accent);
            margin-bottom: 0.5rem;
            text-shadow: 0 0 20px rgba(0,255,136,0.5);
            animation: glow 2s ease-in-out infinite alternate;
        }
        
        @keyframes glow {
            from { text-shadow: 0 0 20px rgba(0,255,136,0.5); }
            to { text-shadow: 0 0 30px rgba(0,255,136,0.8), 0 0 40px rgba(0,255,136,0.4); }
        }
        
        .subtitle {
            color: var(--text-secondary);
            font-size: 1rem;
        }
        
        .features {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-top: 1.5rem;
            flex-wrap: wrap;
        }
        
        .feature {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            background: var(--bg-secondary);
            border-radius: 20px;
            border: 1px solid #333;
            font-size: 0.8rem;
        }
        
        .feature-icon {
            font-size: 1rem;
        }
        
        /* Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
            gap: 2rem;
        }
        
        /* Card */
        .card {
            background: var(--bg-card);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid #2a2a3a;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }
        
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent), transparent);
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 
                0 20px 40px rgba(0,0,0,0.4),
                0 0 60px rgba(0,255,136,0.1);
            border-color: var(--accent);
        }
        
        .card:hover::before {
            opacity: 1;
        }
        
        /* SVG Container */
        .svg-container {
            position: relative;
            width: 100%;
            overflow: hidden;
        }
        
        .svg-container svg {
            width: 100%;
            height: auto;
            display: block;
        }
        
        /* Hover effects on SVG */
        .card:hover .glitch-overlay {
            animation: glitch 0.15s ease-in-out infinite;
        }
        
        @keyframes glitch {
            0%, 100% { opacity: 0; transform: translate(0, 0); }
            20% { opacity: 0.1; transform: translate(-3px, 0); }
            40% { opacity: 0.05; transform: translate(3px, 0); }
            60% { opacity: 0.1; transform: translate(-2px, 2px); }
            80% { opacity: 0.05; transform: translate(2px, -2px); }
        }
        
        /* Info bar */
        .card-info {
            padding: 1rem 1.25rem;
            background: var(--bg-secondary);
            border-top: 1px solid #2a2a3a;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .card-info h3 {
            font-size: 1rem;
            color: var(--accent);
            font-weight: 600;
        }
        
        .card-info .meta {
            display: flex;
            gap: 1rem;
            align-items: center;
        }
        
        .card-info code {
            font-size: 0.7rem;
            color: var(--text-secondary);
            background: var(--bg-primary);
            padding: 0.3rem 0.6rem;
            border-radius: 4px;
        }
        
        .status {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.7rem;
            color: var(--text-secondary);
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent);
            animation: pulse 2s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
        }
        
        /* Archive badge */
        .archive-badge {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(0,0,0,0.7);
            border: 1px solid var(--accent);
            border-radius: 4px;
            padding: 0.3rem 0.6rem;
            font-size: 0.65rem;
            color: var(--accent);
            z-index: 10;
            backdrop-filter: blur(4px);
        }
        
        /* Footer */
        footer {
            text-align: center;
            margin-top: 4rem;
            padding: 2rem;
            border-top: 1px solid #2a2a3a;
            color: var(--text-secondary);
            font-size: 0.85rem;
        }
        
        footer a {
            color: var(--accent);
            text-decoration: none;
        }
        
        footer a:hover {
            text-decoration: underline;
        }
        
        /* Responsive */
        @media (max-width: 900px) {
            .grid {
                grid-template-columns: 1fr;
            }
            
            h1 {
                font-size: 1.8rem;
            }
            
            .features {
                gap: 1rem;
            }
            
            .container {
                padding: 1rem;
            }
        }
        
        /* Loading animation */
        .loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.5s, visibility 0.5s;
        }
        
        .loading.hidden {
            opacity: 0;
            visibility: hidden;
        }
        
        .loading-text {
            font-size: 1.5rem;
            color: var(--accent);
            animation: blink 1s step-end infinite;
        }
        
        @keyframes blink {
            50% { opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="loading" id="loading">
        <span class="loading-text">LOADING PORTFOLIO_</span>
    </div>
    
    <div class="bg-grid"></div>
    
    <div class="container">
        <header>
            <h1>🎬 Portfolio Thumbnails Animés</h1>
            <p class="subtitle">Vignettes SVG avec animations CSS et effets interactifs</p>
            
            <div class="features">
                <div class="feature">
                    <span class="feature-icon">✨</span>
                    <span>Scan Lines</span>
                </div>
                <div class="feature">
                    <span class="feature-icon">💫</span>
                    <span>Pulse Effect</span>
                </div>
                <div class="feature">
                    <span class="feature-icon">⚡</span>
                    <span>Glitch Hover</span>
                </div>
                <div class="feature">
                    <span class="feature-icon">📸</span>
                    <span>Snapshot Frame</span>
                </div>
                <div class="feature">
                    <span class="feature-icon">🔴</span>
                    <span>Live Indicator</span>
                </div>
            </div>
        </header>
        
        <div class="grid" id="grid">
            <!-- Cards will be inserted here by JavaScript -->
        </div>
        
        <footer>
            <p>Généré par <a href="https://cybermind.fr">CyberMind</a> • 
               Script: <code>scripts/generate-thumbnails-animated.py</code></p>
            <p style="margin-top: 0.5rem;">Theme CyberMind v4.1 • Hexo Blog</p>
        </footer>
    </div>
    
    <script>
        const projects = [
            { id: 'gk2-net', name: 'GK2.NET', icon: '🌐', hasArchive: true },
            { id: 'ganimed', name: 'GANIMED', icon: '🔮', hasArchive: true },
            { id: 'icieb', name: 'ICIEB', icon: '🌸', hasArchive: true },
            { id: 'kragzouy-blog', name: 'Kragzouy', icon: '🧙', hasArchive: true },
            { id: 'wengu-yijing', name: 'Wengu Yi Jing', icon: '☯️', hasArchive: true },
            { id: 'michel-murty', name: 'Michel Murty', icon: '👤', hasArchive: true },
            { id: 'armbian-wui', name: 'Armbian WUI', icon: '🖥️', hasArchive: false },
            { id: 'enigmasuite', name: 'EnigmaSuite', icon: '🔐', hasArchive: false }
        ];
        
        async function loadSVG(id) {
            try {
                const response = await fetch(`thumbnails/${id}.svg`);
                return await response.text();
            } catch (e) {
                console.error(`Error loading ${id}.svg:`, e);
                return null;
            }
        }
        
        async function init() {
            const grid = document.getElementById('grid');
            
            for (const project of projects) {
                const svg = await loadSVG(project.id);
                if (!svg) continue;
                
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    ${project.hasArchive ? '<div class="archive-badge">📚 ARCHIVED</div>' : ''}
                    <div class="svg-container">
                        ${svg}
                    </div>
                    <div class="card-info">
                        <h3>${project.icon} ${project.name}</h3>
                        <div class="meta">
                            <code>${project.id}.svg</code>
                            <div class="status">
                                <div class="status-dot"></div>
                                <span>LIVE</span>
                            </div>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            }
            
            // Hide loading
            setTimeout(() => {
                document.getElementById('loading').classList.add('hidden');
            }, 500);
        }
        
        // Start loading
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
