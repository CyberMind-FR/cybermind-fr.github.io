<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4af37"/>
      <stop offset="100%" style="stop-color:#996515"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="#0a0a0f"/>
  <circle cx="400" cy="200" r="150" fill="none" stroke="url(#gold)" stroke-width="3" opacity="0.3"/>
  
  <!-- Yin Yang -->
  <circle cx="400" cy="200" r="80" fill="url(#gold)"/>
  <path d="M400 120 A80 80 0 0 1 400 280 A40 40 0 0 1 400 200 A40 40 0 0 0 400 120" fill="#0a0a0f"/>
  <circle cx="400" cy="160" r="12" fill="#0a0a0f"/>
  <circle cx="400" cy="240" r="12" fill="url(#gold)"/>
  
  <!-- Hexagramme traits -->
  <g transform="translate(150, 150)">
    <rect x="0" y="0" width="80" height="10" fill="#c41e3a" rx="5"/>
    <rect x="0" y="20" width="35" height="10" fill="#1e3a5f" rx="5"/>
    <rect x="45" y="20" width="35" height="10" fill="#1e3a5f" rx="5"/>
    <rect x="0" y="40" width="80" height="10" fill="#c41e3a" rx="5"/>
    <rect x="0" y="60" width="80" height="10" fill="#c41e3a" rx="5"/>
    <rect x="0" y="80" width="35" height="10" fill="#1e3a5f" rx="5"/>
    <rect x="45" y="80" width="35" height="10" fill="#1e3a5f" rx="5"/>
  </g>
  
  <g transform="translate(570, 150)">
    <rect x="0" y="0" width="35" height="10" fill="#1e3a5f" rx="5"/>
    <rect x="45" y="0" width="35" height="10" fill="#1e3a5f" rx="5"/>
    <rect x="0" y="20" width="80" height="10" fill="#c41e3a" rx="5"/>
    <rect x="0" y="40" width="35" height="10" fill="#1e3a5f" rx="5"/>
    <rect x="45" y="40" width="35" height="10" fill="#1e3a5f" rx="5"/>
    <rect x="0" y="60" width="35" height="10" fill="#1e3a5f" rx="5"/>
    <rect x="45" y="60" width="35" height="10" fill="#1e3a5f" rx="5"/>
    <rect x="0" y="80" width="80" height="10" fill="#c41e3a" rx="5"/>
  </g>
  
  <!-- Titre -->
  <text x="400" y="350" text-anchor="middle" font-family="serif" font-size="28" fill="#d4af37" letter-spacing="8">ORACLE YI JING</text>
  <text x="400" y="380" text-anchor="middle" font-family="serif" font-size="14" fill="#9a9a9a" letter-spacing="4">LA LIVRÉE D'HERMÈS</text>
