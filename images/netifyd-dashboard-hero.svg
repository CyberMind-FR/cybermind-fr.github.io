<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0f1a"/>
      <stop offset="50%" style="stop-color:#111827"/>
      <stop offset="100%" style="stop-color:#0a0f1a"/>
    </linearGradient>
    
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
    
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#111827"/>
      <stop offset="100%" style="stop-color:#0a0f1a"/>
    </linearGradient>
    
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:0"/>
    </linearGradient>
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1f2937" stroke-width="0.5"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.5"/>
  
  <!-- Glow effects -->
  <circle cx="200" cy="100" r="250" fill="url(#glowGrad)"/>
  <circle cx="1000" cy="530" r="200" fill="url(#glowGrad)"/>
  
  <!-- Main Dashboard Window -->
  <g transform="translate(80, 70)" filter="url(#shadow)">
    <!-- Window frame -->
    <rect width="1040" height="490" rx="12" fill="url(#cardGrad)" stroke="#374151" stroke-width="1"/>
    
    <!-- Title bar -->
    <rect width="1040" height="40" rx="12" fill="#0a0f1a"/>
    <rect y="28" width="1040" height="12" fill="#0a0f1a"/>
    
    <!-- Window controls -->
    <circle cx="22" cy="20" r="6" fill="#ff5f57"/>
    <circle cx="44" cy="20" r="6" fill="#ffbd2e"/>
    <circle cx="66" cy="20" r="6" fill="#28c840"/>
    
    <!-- Title -->
    <text x="520" y="26" font-family="Inter, -apple-system, sans-serif" font-size="13" fill="#9ca3af" text-anchor="middle">
      Netifyd Dashboard — Deep Packet Inspection @ OpenWrt
    </text>
    
    <!-- Navigation bar -->
    <rect y="40" width="1040" height="36" fill="#111827"/>
    <rect y="75" width="1040" height="1" fill="#374151"/>
    
    <!-- Logo -->
    <rect x="14" y="48" width="26" height="26" rx="6" fill="url(#purpleGrad)"/>
    <text x="27" y="67" font-family="Arial" font-size="14" fill="white" text-anchor="middle">🔍</text>
    
    <text x="50" y="66" font-family="Inter, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#f9fafb">
      Netif<tspan fill="#8b5cf6">yd</tspan>
    </text>
    
    <!-- Nav tabs -->
    <text x="150" y="64" font-family="Inter, sans-serif" font-size="12" fill="#8b5cf6" font-weight="500">Overview</text>
    <rect x="140" y="72" width="52" height="3" rx="1" fill="#8b5cf6"/>
    
    <text x="230" y="64" font-family="Inter, sans-serif" font-size="12" fill="#9ca3af">Flows</text>
    <text x="300" y="64" font-family="Inter, sans-serif" font-size="12" fill="#9ca3af">Applications</text>
    <text x="400" y="64" font-family="Inter, sans-serif" font-size="12" fill="#9ca3af">Devices</text>
    
    <!-- Status badge -->
    <g transform="translate(900, 50)">
      <rect width="90" height="22" rx="11" fill="rgba(16, 185, 129, 0.15)"/>
      <circle cx="14" cy="11" r="4" fill="#10b981">
        <animate attributeName="opacity" values="1;0.5;1" dur="1.5s" repeatCount="indefinite"/>
      </circle>
      <text x="26" y="15" font-family="Inter, sans-serif" font-size="11" fill="#10b981" font-weight="500">DPI Active</text>
    </g>
    
    <text x="1005" y="65" font-family="JetBrains Mono, monospace" font-size="10" fill="#6b7280">v4.4.1</text>
    
    <!-- Quick Stats Row -->
    <g transform="translate(16, 92)">
      <!-- Flows -->
      <g>
        <rect width="160" height="76" rx="8" fill="#111827" stroke="#374151"/>
        <rect width="3" height="76" rx="2" fill="#8b5cf6"/>
        <text x="20" y="28" font-size="20">🔄</text>
        <text x="50" y="36" font-family="JetBrains Mono, monospace" font-size="26" fill="#8b5cf6" font-weight="700">342</text>
        <text x="20" y="56" font-family="Inter, sans-serif" font-size="9" fill="#6b7280" text-transform="uppercase">ACTIVE FLOWS</text>
        <text x="20" y="68" font-family="Inter, sans-serif" font-size="8" fill="#4b5563">245 TCP / 97 UDP</text>
      </g>
      
      <!-- Applications -->
      <g transform="translate(175, 0)">
        <rect width="160" height="76" rx="8" fill="#111827" stroke="#374151"/>
        <rect width="3" height="76" rx="2" fill="#3b82f6"/>
        <text x="20" y="28" font-size="20">📱</text>
        <text x="50" y="36" font-family="JetBrains Mono, monospace" font-size="26" fill="#3b82f6" font-weight="700">24</text>
        <text x="20" y="56" font-family="Inter, sans-serif" font-size="9" fill="#6b7280">APPLICATIONS</text>
        <text x="20" y="68" font-family="Inter, sans-serif" font-size="8" fill="#4b5563">Detected by DPI</text>
      </g>
      
      <!-- Devices -->
      <g transform="translate(350, 0)">
        <rect width="160" height="76" rx="8" fill="#111827" stroke="#374151"/>
        <rect width="3" height="76" rx="2" fill="#06b6d4"/>
        <text x="20" y="28" font-size="20">💻</text>
        <text x="50" y="36" font-family="JetBrains Mono, monospace" font-size="26" fill="#06b6d4" font-weight="700">12</text>
        <text x="20" y="56" font-family="Inter, sans-serif" font-size="9" fill="#6b7280">DEVICES</text>
        <text x="20" y="68" font-family="Inter, sans-serif" font-size="8" fill="#4b5563">On network</text>
      </g>
      
      <!-- Download -->
      <g transform="translate(525, 0)">
        <rect width="160" height="76" rx="8" fill="#111827" stroke="#374151"/>
        <rect width="3" height="76" rx="2" fill="#10b981"/>
        <text x="20" y="28" font-size="20">📥</text>
        <text x="50" y="36" font-family="JetBrains Mono, monospace" font-size="24" fill="#10b981" font-weight="700">2.4 GB</text>
        <text x="20" y="56" font-family="Inter, sans-serif" font-size="9" fill="#6b7280">DOWNLOADED</text>
        <text x="20" y="68" font-family="Inter, sans-serif" font-size="8" fill="#4b5563">Total RX</text>
      </g>
      
      <!-- Upload -->
      <g transform="translate(700, 0)">
        <rect width="160" height="76" rx="8" fill="#111827" stroke="#374151"/>
        <rect width="3" height="76" rx="2" fill="#f59e0b"/>
        <text x="20" y="28" font-size="20">📤</text>
        <text x="50" y="36" font-family="JetBrains Mono, monospace" font-size="24" fill="#f59e0b" font-weight="700">856 MB</text>
        <text x="20" y="56" font-family="Inter, sans-serif" font-size="9" fill="#6b7280">UPLOADED</text>
        <text x="20" y="68" font-family="Inter, sans-serif" font-size="8" fill="#4b5563">Total TX</text>
      </g>
      
      <!-- Categories -->
      <g transform="translate(875, 0)">
        <rect width="149" height="76" rx="8" fill="#111827" stroke="#374151"/>
        <rect width="3" height="76" rx="2" fill="#ec4899"/>
        <text x="20" y="28" font-size="20">🏷️</text>
        <text x="50" y="36" font-family="JetBrains Mono, monospace" font-size="26" fill="#ec4899" font-weight="700">8</text>
        <text x="20" y="56" font-family="Inter, sans-serif" font-size="9" fill="#6b7280">CATEGORIES</text>
        <text x="20" y="68" font-family="Inter, sans-serif" font-size="8" fill="#4b5563">Traffic types</text>
      </g>
    </g>
    
    <!-- Charts Row -->
    <g transform="translate(16, 186)">
      <!-- Protocol Donut -->
      <g>
        <rect width="500" height="220" rx="10" fill="#111827" stroke="#374151"/>
        <rect width="500" height="40" rx="10" fill="rgba(0,0,0,0.3)"/>
        <rect y="30" width="500" height="10" fill="rgba(0,0,0,0.3)"/>
        <text x="16" y="26" font-size="16">📊</text>
        <text x="40" y="26" font-family="Inter, sans-serif" font-size="13" fill="#f9fafb" font-weight="600">Protocol Distribution</text>
        
        <rect x="400" y="10" rx="10" width="80" height="20" fill="#8b5cf6"/>
        <text x="440" y="24" font-family="JetBrains Mono, monospace" font-size="11" fill="white" font-weight="600" text-anchor="middle">342 flows</text>
        
        <!-- Donut chart -->
        <g transform="translate(130, 130)">
          <circle cx="0" cy="0" r="65" fill="none" stroke="#8b5cf6" stroke-width="20" 
                  stroke-dasharray="293 408" transform="rotate(-90)"/>
          <circle cx="0" cy="0" r="65" fill="none" stroke="#3b82f6" stroke-width="20" 
                  stroke-dasharray="78 408" stroke-dashoffset="-293" transform="rotate(-90)"/>
          <circle cx="0" cy="0" r="65" fill="none" stroke="#06b6d4" stroke-width="20" 
                  stroke-dasharray="37 408" stroke-dashoffset="-371" transform="rotate(-90)"/>
          <circle cx="0" cy="0" r="42" fill="#111827"/>
          <text x="0" y="5" font-family="JetBrains Mono, monospace" font-size="26" fill="#f9fafb" font-weight="700" text-anchor="middle">342</text>
          <text x="0" y="22" font-family="Inter, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Flows</text>
        </g>
        
        <!-- Legend -->
        <g transform="translate(280, 80)">
          <rect width="10" height="10" rx="2" fill="#8b5cf6"/>
          <text x="18" y="9" font-family="Inter, sans-serif" font-size="11" fill="#9ca3af">TCP</text>
          <text x="100" y="9" font-family="JetBrains Mono, monospace" font-size="11" fill="#f9fafb" font-weight="600">245</text>
          
          <g transform="translate(0, 22)">
            <rect width="10" height="10" rx="2" fill="#3b82f6"/>
            <text x="18" y="9" font-family="Inter, sans-serif" font-size="11" fill="#9ca3af">UDP</text>
            <text x="100" y="9" font-family="JetBrains Mono, monospace" font-size="11" fill="#f9fafb" font-weight="600">78</text>
          </g>
          
          <g transform="translate(0, 44)">
            <rect width="10" height="10" rx="2" fill="#06b6d4"/>
            <text x="18" y="9" font-family="Inter, sans-serif" font-size="11" fill="#9ca3af">QUIC</text>
            <text x="100" y="9" font-family="JetBrains Mono, monospace" font-size="11" fill="#f9fafb" font-weight="600">19</text>
          </g>
        </g>
      </g>
      
      <!-- Top Applications -->
      <g transform="translate(516, 0)">
        <rect width="508" height="220" rx="10" fill="#111827" stroke="#374151"/>
        <rect width="508" height="40" rx="10" fill="rgba(0,0,0,0.3)"/>
        <rect y="30" width="508" height="10" fill="rgba(0,0,0,0.3)"/>
        <text x="16" y="26" font-size="16">📱</text>
        <text x="40" y="26" font-family="Inter, sans-serif" font-size="13" fill="#f9fafb" font-weight="600">Top Applications</text>
        
        <rect x="408" y="10" rx="10" width="85" height="20" fill="#8b5cf6"/>
        <text x="450" y="24" font-family="JetBrains Mono, monospace" font-size="11" fill="white" font-weight="600" text-anchor="middle">24 detected</text>
        
        <!-- Bar chart -->
        <g transform="translate(20, 55)">
          <!-- HTTPS -->
          <g>
            <text x="0" y="10" font-size="12">🔒</text>
            <text x="22" y="10" font-family="Inter, sans-serif" font-size="11" fill="#9ca3af">HTTPS</text>
            <rect x="90" y="0" width="300" height="12" rx="6" fill="#1f2937"/>
            <rect x="90" y="0" width="300" height="12" rx="6" fill="url(#purpleGrad)"/>
            <text x="400" y="10" font-family="JetBrains Mono, monospace" font-size="11" fill="#f9fafb" font-weight="600">1.2 GB</text>
          </g>
          
          <!-- YouTube -->
          <g transform="translate(0, 26)">
            <text x="0" y="10" font-size="12">📺</text>
            <text x="22" y="10" font-family="Inter, sans-serif" font-size="11" fill="#9ca3af">YouTube</text>
            <rect x="90" y="0" width="300" height="12" rx="6" fill="#1f2937"/>
            <rect x="90" y="0" width="195" height="12" rx="6" fill="url(#purpleGrad)"/>
            <text x="400" y="10" font-family="JetBrains Mono, monospace" font-size="11" fill="#f9fafb" font-weight="600">780 MB</text>
          </g>
          
          <!-- Netflix -->
          <g transform="translate(0, 52)">
            <text x="0" y="10" font-size="12">🎬</text>
            <text x="22" y="10" font-family="Inter, sans-serif" font-size="11" fill="#9ca3af">Netflix</text>
            <rect x="90" y="0" width="300" height="12" rx="6" fill="#1f2937"/>
            <rect x="90" y="0" width="126" height="12" rx="6" fill="url(#purpleGrad)"/>
            <text x="400" y="10" font-family="JetBrains Mono, monospace" font-size="11" fill="#f9fafb" font-weight="600">504 MB</text>
          </g>
          
          <!-- Zoom -->
          <g transform="translate(0, 78)">
            <text x="0" y="10" font-size="12">📹</text>
            <text x="22" y="10" font-family="Inter, sans-serif" font-size="11" fill="#9ca3af">Zoom</text>
            <rect x="90" y="0" width="300" height="12" rx="6" fill="#1f2937"/>
            <rect x="90" y="0" width="84" height="12" rx="6" fill="url(#purpleGrad)"/>
            <text x="400" y="10" font-family="JetBrains Mono, monospace" font-size="11" fill="#f9fafb" font-weight="600">336 MB</text>
          </g>
          
          <!-- Discord -->
          <g transform="translate(0, 104)">
            <text x="0" y="10" font-size="12">💬</text>
            <text x="22" y="10" font-family="Inter, sans-serif" font-size="11" fill="#9ca3af">Discord</text>
            <rect x="90" y="0" width="300" height="12" rx="6" fill="#1f2937"/>
            <rect x="90" y="0" width="45" height="12" rx="6" fill="url(#purpleGrad)"/>
            <text x="400" y="10" font-family="JetBrains Mono, monospace" font-size="11" fill="#f9fafb" font-weight="600">180 MB</text>
          </g>
          
          <!-- DNS -->
          <g transform="translate(0, 130)">
            <text x="0" y="10" font-size="12">📋</text>
            <text x="22" y="10" font-family="Inter, sans-serif" font-size="11" fill="#9ca3af">DNS</text>
            <rect x="90" y="0" width="300" height="12" rx="6" fill="#1f2937"/>
            <rect x="90" y="0" width="24" height="12" rx="6" fill="url(#purpleGrad)"/>
            <text x="400" y="10" font-family="JetBrains Mono, monospace" font-size="11" fill="#f9fafb" font-weight="600">96 MB</text>
          </g>
        </g>
      </g>
    </g>
    
    <!-- Bottom devices preview -->
    <g transform="translate(16, 420)">
      <text x="0" y="16" font-size="14">💻</text>
      <text x="24" y="16" font-family="Inter, sans-serif" font-size="12" fill="#f9fafb" font-weight="600">Recent Devices</text>
      
      <g transform="translate(0, 26)">
        <!-- Device 1 -->
        <rect width="200" height="40" rx="6" fill="#1f2937" stroke="#374151"/>
        <rect x="10" y="8" width="24" height="24" rx="6" fill="url(#purpleGrad)"/>
        <text x="22" y="25" font-size="12" text-anchor="middle">🍎</text>
        <text x="44" y="18" font-family="Inter, sans-serif" font-size="11" fill="#f9fafb" font-weight="500">MacBook-Pro</text>
        <text x="44" y="32" font-family="JetBrains Mono, monospace" font-size="9" fill="#6b7280">192.168.1.105</text>
        
        <!-- Device 2 -->
        <g transform="translate(210, 0)">
          <rect width="200" height="40" rx="6" fill="#1f2937" stroke="#374151"/>
          <rect x="10" y="8" width="24" height="24" rx="6" fill="url(#purpleGrad)"/>
          <text x="22" y="25" font-size="12" text-anchor="middle">📱</text>
          <text x="44" y="18" font-family="Inter, sans-serif" font-size="11" fill="#f9fafb" font-weight="500">iPhone-Jean</text>
          <text x="44" y="32" font-family="JetBrains Mono, monospace" font-size="9" fill="#6b7280">192.168.1.108</text>
        </g>
        
        <!-- Device 3 -->
        <g transform="translate(420, 0)">
          <rect width="200" height="40" rx="6" fill="#1f2937" stroke="#374151"/>
          <rect x="10" y="8" width="24" height="24" rx="6" fill="url(#purpleGrad)"/>
          <text x="22" y="25" font-size="12" text-anchor="middle">🍓</text>
          <text x="44" y="18" font-family="Inter, sans-serif" font-size="11" fill="#f9fafb" font-weight="500">Raspberry-Pi</text>
          <text x="44" y="32" font-family="JetBrains Mono, monospace" font-size="9" fill="#6b7280">192.168.1.120</text>
        </g>
        
        <!-- Device 4 -->
        <g transform="translate(630, 0)">
          <rect width="200" height="40" rx="6" fill="#1f2937" stroke="#374151"/>
          <rect x="10" y="8" width="24" height="24" rx="6" fill="url(#purpleGrad)"/>
          <text x="22" y="25" font-size="12" text-anchor="middle">📺</text>
          <text x="44" y="18" font-family="Inter, sans-serif" font-size="11" fill="#f9fafb" font-weight="500">Samsung-TV</text>
          <text x="44" y="32" font-family="JetBrains Mono, monospace" font-size="9" fill="#6b7280">192.168.1.115</text>
        </g>
        
        <!-- More indicator -->
        <g transform="translate(840, 0)">
          <rect width="180" height="40" rx="6" fill="#111827" stroke="#374151" stroke-dasharray="4,4"/>
          <text x="90" y="25" font-family="Inter, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">+8 more devices</text>
        </g>
      </g>
    </g>
  </g>
  
  <!-- Floating icon -->
  <g transform="translate(1050, 45)" filter="url(#glow)">
    <circle cx="35" cy="35" r="32" fill="#111827" stroke="url(#purpleGrad)" stroke-width="2"/>
    <text x="35" y="47" font-size="28" text-anchor="middle">🔍</text>
  </g>
  
  <!-- Corner decorations -->
  <rect x="0" y="0" width="350" height="3" fill="url(#purpleGrad)" opacity="0.8"/>
  <path d="M0 630 L0 590 L40 630 Z" fill="url(#purpleGrad)" opacity="0.3"/>
  <path d="M1200 0 L1200 40 L1160 0 Z" fill="url(#purpleGrad)" opacity="0.3"/>
  
  <!-- Footer text -->
  <text x="600" y="605" font-family="Inter, -apple-system, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">
    CyberMind.fr — Deep Packet Inspection &amp; Network Intelligence for OpenWrt
  </text>
</svg>
