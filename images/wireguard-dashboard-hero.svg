  </g>
  
  <!-- Floating lock icon -->
  <g transform="translate(1045, 40)" filter="url(#glow)">
    <circle cx="40" cy="40" r="36" fill="#0f172a" stroke="url(#tunnelGrad)" stroke-width="2"/>
    <text x="40" y="52" font-size="32" text-anchor="middle">🔐</text>
  </g>
  
  <!-- Corner decorations -->
  <rect x="0" y="0" width="400" height="3" fill="url(#tunnelGrad)" opacity="0.8"/>
  <path d="M0 630 L0 580 L50 630 Z" fill="url(#tunnelGrad)" opacity="0.3"/>
  <path d="M1200 0 L1200 50 L1150 0 Z" fill="url(#tunnelGrad)" opacity="0.3"/>
  
  <!-- Footer text -->
  <text x="600" y="608" font-family="Inter, -apple-system, sans-serif" font-size="13" fill="#64748b" text-anchor="middle">
    CyberMind.fr — Secure VPN Monitoring for OpenWrt with WireGuard®
  </text>
</svg>
