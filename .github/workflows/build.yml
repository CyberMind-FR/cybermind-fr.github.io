name: Build

on:
  push:
    branches:
      - master  # default branch

jobs:
  pages:
    runs-on: ubuntu-latest
    steps:
    
# .github/workflows/build.yml
- uses: actions/setup-node@v4
  with:
    node-version: '20'   # Hexo 8 requires >=20
    cache: 'npm'
- run: npm ci            # respects your lock file + overrides
- run: npm run build
