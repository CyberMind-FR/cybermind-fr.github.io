<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-michel-murty" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051520"/>
      <stop offset="100%" stop-color="#000"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg-michel-murty)"/>
  
  <!-- Subtle grid -->
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M30 0L0 0 0 30" fill="none" stroke="#66ccff" stroke-width="0.2" opacity="0.1"/>
  </pattern>
  <rect width="100%" height="100%" fill="url(#grid)"/>
  
  <!-- Top accent -->
  <rect x="0" y="0" width="100%" height="3" fill="#66ccff" opacity="0.8"/>
  
  <!-- Left side info -->
  <circle cx="60" cy="120" r="40" fill="#051520" stroke="#66ccff" stroke-width="2"/>
  <text x="60" y="130" font-size="28" text-anchor="middle" fill="#66ccff">👤</text>
  
  <text x="25" y="200" font-family="'JetBrains Mono',monospace" font-size="28" font-weight="bold" fill="#66ccff">Michel Murty</text>
  <text x="25" y="230" font-family="system-ui,sans-serif" font-size="12" fill="#888">Site Personnel • 2000-présent</text>
  
  <!-- Browser window -->
  <g filter="url(#shadow)">
    <!-- Window frame -->
    <rect x="380" y="50" width="400" height="300" rx="8" fill="#1a1a1a" stroke="#66ccff" stroke-width="1" opacity="0.9"/>
    
    <!-- Title bar -->
    <rect x="380" y="50" width="400" height="25" rx="8" fill="#2a2a2a"/>
    <rect x="380" y="67" width="400" height="8" fill="#2a2a2a"/>
    
    <!-- Window buttons -->
    <circle cx="395" cy="62" r="5" fill="#ff5f56"/>
    <circle cx="412" cy="62" r="5" fill="#ffbd2e"/>
    <circle cx="429" cy="62" r="5" fill="#27c93f"/>
    
    <!-- URL bar -->
    <rect x="445" y="55" width="320" height="15" rx="3" fill="#1a1a1a"/>
    <text x="455" y="65" font-family="monospace" font-size="8" fill="#666">https://michelmurty.free.fr</text>
    
    <!-- Content area -->
    <rect x="380" y="75" width="400" height="275" fill="#051520"/>
    
    <!-- Content -->
    <rect x="385" y="73" width="390" height="18" fill="#66ccff" opacity="0.15"/>
    <text x="395" y="85" font-family="sans-serif" font-size="10" fill="#66ccff" font-weight="bold">Michel Murty</text>
    <text x="395" y="105" font-family="sans-serif" font-size="9" fill="#ccc">Bienvenue sur ma page personnelle</text>
    <line x1="395" y1="121" x2="765" y2="121" stroke="#66ccff" stroke-width="0.5" opacity="0.3"/>
    <text x="395" y="131" font-family="sans-serif" font-size="8" fill="#66ccff" text-decoration="underline">→ Galerie photos</text>
    <text x="395" y="145" font-family="sans-serif" font-size="8" fill="#66ccff" text-decoration="underline">→ Mes projets</text>
    <text x="395" y="159" font-family="sans-serif" font-size="8" fill="#66ccff" text-decoration="underline">→ Contact</text>
    <text x="395" y="173" font-family="monospace" font-size="6" fill="#555">Hébergé par Free.fr</text>
  </g>
  
  <!-- Year badge -->
  <rect x="700" y="15" width="85" height="24" rx="4" fill="#66ccff" opacity="0.15"/>
  <rect x="700" y="15" width="85" height="24" rx="4" fill="none" stroke="#66ccff" stroke-width="1" opacity="0.4"/>
  <text x="743" y="32" font-family="monospace" font-size="10" text-anchor="middle" fill="#66ccff">ARCHIVED</text>
  
  <!-- Bottom bar -->
  <rect x="0" y="415" width="100%" height="35" fill="#0a0a0a"/>
  <text x="15" y="438" font-family="monospace" font-size="11" fill="#66ccff" opacity="0.7">cybermind.fr/portfolio/michel-murty</text>
  <text x="785" y="438" font-family="monospace" font-size="9" text-anchor="end" fill="#444">SNAPSHOT</text>
</svg>