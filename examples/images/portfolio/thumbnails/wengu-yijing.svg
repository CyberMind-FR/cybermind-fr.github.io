<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="450" viewBox="0 0 800 450" 
     xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="bg-wengu-yijing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111111"/>
      <stop offset="100%" stop-color="#000"/>
    </linearGradient>
    <linearGradient id="accent-wengu-yijing" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="shadow-wengu-yijing">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="glow-wengu-yijing">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="preview-clip-wengu-yijing">
      <rect x="420" y="60" width="360" height="280" rx="8"/>
    </clipPath>
    <style>
      @keyframes pulse { 0%,100% { opacity:0.8 } 50% { opacity:1 } }
      @keyframes scan { 0% { transform:translateY(0) } 100% { transform:translateY(450px) } }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg-wengu-yijing)"/>
  
  <!-- Grid pattern -->
  <pattern id="grid-wengu-yijing" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0L0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.3" opacity="0.15"/>
  </pattern>
  <rect width="100%" height="100%" fill="url(#grid-wengu-yijing)"/>
  
  <!-- Top accent bar -->
  <rect x="0" y="0" width="100%" height="4" fill="url(#accent-wengu-yijing)"/>
  
  <!-- Scan line animation -->
  <rect x="0" y="0" width="100%" height="2" fill="#ffffff" opacity="0.08">
    <animate attributeName="y" values="0;450;0" dur="4s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Left side: Info -->
  <g>
    <!-- Icon -->
    <circle cx="70" cy="140" r="45" fill="#111111" stroke="#ffffff" stroke-width="2" opacity="0.9" style="animation:pulse 3s infinite"/>
    <text x="70" y="155" font-size="36" text-anchor="middle" fill="#ffffff">☯️</text>
    
    <!-- Title -->
    <text x="30" y="240" font-family="'JetBrains Mono',monospace" font-size="32" font-weight="bold" 
          fill="#ffffff" filter="url(#glow-wengu-yijing)">Wengu Yi Jing</text>
    
    <!-- Subtitle -->
    <text x="30" y="275" font-family="system-ui,sans-serif" font-size="14" fill="#999">Ressources Classiques</text>
    
    <!-- Archive URL -->
    <text x="30" y="310" font-family="monospace" font-size="10" fill="#555">wengu.tartarie.com</text>
  </g>
  
  <!-- Right side: Live Preview -->
  <g filter="url(#shadow-wengu-yijing)">
    <!-- Browser chrome -->
    <rect x="418" y="36" width="364" height="308" rx="10" 
          fill="#1a1a1a" stroke="#ffffff" stroke-width="1" opacity="0.9"/>
    
    <!-- Browser header -->
    <circle cx="432" cy="48" r="4" fill="#ff5f56"/>
    <circle cx="446" cy="48" r="4" fill="#ffbd2e"/>
    <circle cx="460" cy="48" r="4" fill="#27ca3f"/>
    
    <!-- URL bar -->
    <rect x="475" y="42" width="290" height="14" rx="3" fill="#2a2a2a"/>
    <text x="482" y="52" font-family="monospace" font-size="7" fill="#666">
      wengu.tartarie.com
    </text>
    
    <!-- Preview content (foreignObject with HTML) -->
    <g clip-path="url(#preview-clip-wengu-yijing)">
      
    <foreignObject x="420" y="60" width="360" height="280">
        <div xmlns="http://www.w3.org/1999/xhtml" style="width:100%;height:100%;overflow:hidden;border-radius:6px;">
            <div style="background:#f5f5f0;width:100%;height:100%;font-family:'Times New Roman',serif;overflow:hidden"><div style="background:#222;padding:4px 8px;text-align:center"><span style="color:#fff;font-size:9px">文 古 · Wengu</span></div><div style="padding:6px;text-align:center"><div style="font-size:28px;color:#333;line-height:1">☯</div><div style="color:#666;font-size:8px;margin-top:4px;font-style:italic">易 經</div><div style="color:#333;font-size:6px;margin-top:2px">Le Classique des Changements</div></div><div style="padding:0 8px;display:flex;justify-content:center;gap:3px;flex-wrap:wrap"><span style="color:#000;font-size:7px">䷀</span><span style="color:#000;font-size:7px">䷁</span><span style="color:#000;font-size:7px">䷂</span><span style="color:#000;font-size:7px">䷃</span><span style="color:#000;font-size:7px">䷄</span><span style="color:#000;font-size:7px">䷅</span><span style="color:#000;font-size:7px">䷆</span><span style="color:#000;font-size:7px">䷇</span></div><div style="margin-top:6px;padding:4px;background:#eee;text-align:center"><span style="color:#666;font-size:5px">64 Hexagrammes • Textes classiques</span></div></div>
        </div>
    </foreignObject>
    
    </g>
    
    <!-- Corner decorations -->
    <path d="M420,72 L420,60 L432,60" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.5"/>
    <path d="M768,60 L780,60 L780,72" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.5"/>
    <path d="M420,328 L420,340 L432,340" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.5"/>
    <path d="M768,340 L780,340 L780,328" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.5"/>
  </g>
  
  <!-- Year badge -->
  <rect x="670" y="15" width="115" height="28" rx="4" fill="#ffffff" opacity="0.15"/>
  <rect x="670" y="15" width="115" height="28" rx="4" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.5"/>
  <text x="728" y="35" font-family="monospace" font-size="12" text-anchor="middle" fill="#ffffff">2000-2025</text>
  
  <!-- Bottom bar -->
  <rect x="0" y="412" width="100%" height="38" fill="#0a0a0a" opacity="0.95"/>
  <line x1="0" y1="412" x2="100%" y2="412" stroke="#ffffff" stroke-width="1" opacity="0.3"/>
  <text x="15" y="436" font-family="monospace" font-size="11" fill="#ffffff" opacity="0.8">cybermind.fr/portfolio/wengu-yijing</text>
  
  <!-- Live indicator -->
  <circle cx="770" cy="431" r="5" fill="#ffffff" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.4;0.9" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="750" y="436" font-family="monospace" font-size="9" text-anchor="end" fill="#666">PREVIEW</text>
  
  <!-- Corner accent -->
  <path d="M800,0 L800,50 L750,0 Z" fill="#ffffff" opacity="0.06"/>
</svg>