<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="450" viewBox="0 0 800 450" 
     xmlns="http://www.w3.org/2000/svg">
  <defs>
    
            <pattern id="yinyang" width="80" height="80" patternUnits="userSpaceOnUse">
                <circle cx="40" cy="40" r="35" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.15"/>
                <path d="M40,5 A35,35 0 0,1 40,75 A17.5,17.5 0 0,1 40,40 A17.5,17.5 0 0,0 40,5" 
                      fill="#ffffff" opacity="0.05"/>
            </pattern>
        
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#111111;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.5" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg-gradient)"/>
  <rect width="100%" height="100%" fill="url(#yinyang)" opacity="0.5"/>
  
  <!-- Accent line top -->
  <rect x="0" y="0" width="100%" height="4" fill="url(#accent-gradient)"/>
  
  <!-- Icon circle -->
  <circle cx="100" cy="225" r="60" fill="#111111" stroke="#ffffff" stroke-width="2" opacity="0.8"/>
  <text x="100" y="245" font-size="50" text-anchor="middle" fill="#ffffff">☯️</text>
  
  <!-- Title -->
  <text x="200" y="185" font-family="monospace" font-size="48" font-weight="bold" fill="#ffffff" filter="url(#glow)">Wengu Yi Jing</text>
  
  <!-- Subtitle -->
  <text x="200" y="235" font-family="sans-serif" font-size="24" fill="#cccccc">Ressources Classiques</text>
  
  <!-- Tags -->
  <text x="200" y="275" font-family="monospace" font-size="14" fill="#888888">Yi Jing • Philosophie • Taoïsme • Hexagrammes</text>
  
  <!-- Year badge -->
  <rect x="650" y="20" width="130" height="36" rx="4" fill="#ffffff" opacity="0.2"/>
  <rect x="650" y="20" width="130" height="36" rx="4" fill="none" stroke="#ffffff" stroke-width="1"/>
  <text x="715" y="45" font-family="monospace" font-size="16" text-anchor="middle" fill="#ffffff">2000-2025</text>
  
  <!-- Bottom bar -->
  <rect x="0" y="410" width="100%" height="40" fill="#111111" opacity="0.8"/>
  <text x="20" y="435" font-family="monospace" font-size="14" fill="#ffffff">portfolio.cybermind.fr/wengu-yijing</text>
  <text x="780" y="435" font-family="monospace" font-size="12" text-anchor="end" fill="#666666">ARCHIVED</text>
  
  <!-- Corner accent -->
  <path d="M800,0 L800,80 L720,0 Z" fill="#ffffff" opacity="0.1"/>
</svg>