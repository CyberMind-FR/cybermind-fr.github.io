<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="450" viewBox="0 0 800 450" 
     xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" class="portfolio-thumbnail">
  <defs>
    <pattern id="stars" width="50" height="50" patternUnits="userSpaceOnUse">
            <circle cx="25" cy="25" r="1" fill="#ffcc00" opacity="0.2"/>
          </pattern>
    
    <pattern id="scanlines" patternUnits="userSpaceOnUse" width="4" height="4">
      <line x1="0" y1="0" x2="4" y2="0" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
    
    
    <linearGradient id="bg-grad-kragzouy-blog" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#332200"/>
      <stop offset="50%" stop-color="#1a1100"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    
    <linearGradient id="accent-grad-kragzouy-blog" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffcc00"/>
      <stop offset="100%" stop-color="#ffcc00" stop-opacity="0.3"/>
    </linearGradient>
    
    <linearGradient id="snapshot-overlay-kragzouy-blog" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="70%" stop-color="transparent"/>
      <stop offset="100%" stop-color="#1a1100"/>
    </linearGradient>
    
    <filter id="glow-kragzouy-blog">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="1" result="noise"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" in2="noise" mode="multiply" result="blend"/>
      <feComposite in="blend" in2="SourceGraphic" operator="in"/>
    </filter>
    
    <clipPath id="snapshot-clip-kragzouy-blog">
      <rect x="480" y="80" width="320" height="200" rx="8"/>
    </clipPath>
    
    <mask id="vignette-kragzouy-blog">
      <rect x="480" y="80" width="320" height="200" fill="white"/>
      <rect x="480" y="80" width="320" height="200" fill="url(#snapshot-overlay-kragzouy-blog)"/>
    </mask>
  </defs>
  
  
    <style>
      @keyframes glitch {
        0%, 100% { opacity: 1; transform: translate(0, 0); }
        20% { opacity: 0.8; transform: translate(-2px, 0); }
        40% { opacity: 0.9; transform: translate(2px, 0); }
        60% { opacity: 0.7; transform: translate(-1px, 1px); }
        80% { opacity: 0.95; transform: translate(1px, -1px); }
      }
      @keyframes scan {
        0% { transform: translateY(-100%); }
        100% { transform: translateY(450px); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.8; }
        50% { opacity: 1; }
      }
      @keyframes flicker {
        0%, 100% { opacity: 1; }
        92% { opacity: 1; }
        93% { opacity: 0.8; }
        94% { opacity: 1; }
        95% { opacity: 0.9; }
        96% { opacity: 1; }
      }
      .snapshot-frame { animation: pulse 3s ease-in-out infinite; }
      .scan-line { animation: scan 4s linear infinite; }
      .title-text { animation: flicker 5s linear infinite; }
      .glitch-overlay { animation: glitch 0.3s ease-in-out infinite; opacity: 0; }
      .card:hover .glitch-overlay { opacity: 0.5; }
    </style>
    
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg-grad-kragzouy-blog)"/>
  <rect width="100%" height="100%" fill="url(#stars)" opacity="0.6"/>
  
  <!-- Scanlines overlay -->
  <rect width="100%" height="100%" fill="url(#scanlines)" opacity="0.5"/>
  
  <!-- Animated scan line -->
  <rect class="scan-line" x="0" y="0" width="100%" height="2" fill="#ffcc00" opacity="0.1"/>
  
  <!-- Top accent bar -->
  <rect x="0" y="0" width="100%" height="3" fill="url(#accent-grad-kragzouy-blog)"/>
  
  <!-- Left content area -->
  <g class="content-left">
    <!-- Icon with glow -->
    <circle cx="80" cy="180" r="50" fill="#1a1100" stroke="#ffcc00" stroke-width="2" opacity="0.9" class="snapshot-frame"/>
    <text x="80" y="195" font-size="40" text-anchor="middle" fill="#ffcc00">🧙</text>
    
    <!-- Title -->
    <text x="30" y="280" font-family="'JetBrains Mono', monospace" font-size="36" font-weight="bold" 
          fill="#ffcc00" filter="url(#glow-kragzouy-blog)" class="title-text">Kragzouy</text>
    
    <!-- Subtitle -->
    <text x="30" y="315" font-family="system-ui, sans-serif" font-size="16" fill="#aaaaaa">Univers Créatif depuis 1982</text>
    
    <!-- Tags -->
    <text x="30" y="350" font-family="'JetBrains Mono', monospace" font-size="11" fill="#666666">Poésie • Musique • Créatif • Philosophie</text>
  </g>
  
  <!-- Snapshot area -->
  <g class="snapshot-area">
    <!-- Frame background -->
    <rect x="476" y="76" width="328" height="208" rx="10" 
          fill="#1a1100" stroke="#ffcc00" stroke-width="1" opacity="0.8"/>
    
    <!-- Snapshot placeholder or image -->
    <g clip-path="url(#snapshot-clip-kragzouy-blog)">
      <!-- Placeholder gradient background -->
      <rect x="480" y="80" width="320" height="200" fill="#332200"/>
      
      <!-- Grid pattern for placeholder -->
      <rect x="480" y="80" width="320" height="200" fill="url(#stars)" opacity="0.3"/>
      
      <!-- Placeholder text -->
      <text x="640" y="170" font-family="monospace" font-size="12" 
            text-anchor="middle" fill="#ffcc00" opacity="0.5">SNAPSHOT</text>
      <text x="640" y="190" font-family="monospace" font-size="10" 
            text-anchor="middle" fill="#666666">https://kragzouy.blogspot.com/...</text>
      
      <!-- Image element (to be replaced with actual snapshot) -->
      <!-- <image xlink:href="[SNAPSHOT_URL]" x="480" y="80" width="320" height="200" preserveAspectRatio="xMidYMid slice"/> -->
      
      <!-- Vignette overlay -->
      <rect x="480" y="80" width="320" height="200" fill="url(#snapshot-overlay-kragzouy-blog)"/>
    </g>
    
    <!-- Corner decorations -->
    <path d="M480,95 L480,80 L495,80" fill="none" stroke="#ffcc00" stroke-width="2"/>
    <path d="M785,80 L800,80 L800,95" fill="none" stroke="#ffcc00" stroke-width="2"/>
    <path d="M480,265 L480,280 L495,280" fill="none" stroke="#ffcc00" stroke-width="2"/>
    <path d="M785,280 L800,280 L800,265" fill="none" stroke="#ffcc00" stroke-width="2"/>
    
    <!-- Archive label -->
    <rect x="720" y="256" width="76" height="20" rx="3" fill="#ffcc00" opacity="0.2"/>
    <text x="758" y="270" font-family="monospace" font-size="9" 
          text-anchor="middle" fill="#ffcc00">ARCHIVED</text>
  </g>
  
  <!-- Year badge -->
  <g class="year-badge">
    <rect x="680" y="15" width="105" height="30" rx="4" fill="#ffcc00" opacity="0.15"/>
    <rect x="680" y="15" width="105" height="30" rx="4" fill="none" stroke="#ffcc00" stroke-width="1" opacity="0.5"/>
    <text x="733" y="36" font-family="monospace" font-size="14" text-anchor="middle" fill="#ffcc00">1982-présent</text>
  </g>
  
  <!-- Bottom bar -->
  <rect x="0" y="415" width="100%" height="35" fill="#1a1100" opacity="0.95"/>
  <line x1="0" y1="415" x2="100%" y2="415" stroke="#ffcc00" stroke-width="1" opacity="0.3"/>
  <text x="15" y="438" font-family="monospace" font-size="12" fill="#ffcc00" opacity="0.8">cybermind.fr/portfolio/kragzouy-blog</text>
  
  <!-- Status indicator -->
  <circle cx="775" cy="433" r="4" fill="#ffcc00" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.4;0.8" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="760" y="438" font-family="monospace" font-size="10" text-anchor="end" fill="#666666">LIVE</text>
  
  <!-- Glitch overlay (activé au hover via CSS externe) -->
  <rect class="glitch-overlay" x="0" y="0" width="100%" height="100%" fill="#ffcc00" opacity="0"/>
  
  <!-- Corner accent -->
  <path d="M800,0 L800,60 L740,0 Z" fill="#ffcc00" opacity="0.08"/>
</svg>