# ═══════════════════════════════════════════════════════════════════════════
# CONFIGURATION MENU AVEC SOUS-MENUS - Exemple pour _config.cybermind.yml
# ═══════════════════════════════════════════════════════════════════════════

# Menu principal avec support des sous-menus dropdown
# 
# Syntaxe:
#   - Menu simple:     "Nom": "/chemin/"
#   - Menu avec dropdown:
#       "Nom":
#         _path: "/chemin/"           # Chemin principal (optionnel)
#         "Sous-menu 1": "/chemin1/"
#         "Sous-menu 2": "/chemin2/"

menu:
  Accueil: /
  
  # Menu Blog avec sous-catégories
  Blog:
    _path: /blog/
    🛡️ Cybersécurité: /blog/cybersecurity/
    ⚙️ Embarqué: /blog/embedded/
    🐧 Linux: /blog/linux/
    🎨 Créativité: /blog/creative/
    🧘 Philosophie: /blog/philosophy/
    📖 Tutoriels: /blog/tutorials/
  
  # Menu Apps avec sous-sections
  Apps:
    _path: /apps/
    ∞ Tresse Lemniscate: /apps/tresse-lemniscate/
    ☯️ Yi Jing Oracle: /apps/yijing/
    🎵 Formes Sonores: /apps/formes-sonores/
  
  # Menus simples
  Services: /services/
  Portfolio: /portfolio/
  Contact: /contact/

# ═══════════════════════════════════════════════════════════════════════════
