# ─────────────────────────────────────────────────────────────────────────────
# À PROPOS
# ─────────────────────────────────────────────────────────────────────────────
about:
  name: "G.KERMA (aka) Gandalf"
  avatar: "🧙"
  title: "Cybersecurity & Linux Expert"
  description: |
    Fort de plus de 35 ans d'expérience en cybersécurité et développement systèmes embarqués, je partage mon expertise à travers des articles techniques, tutoriels et retours d'expérience.
    
    Mon blog CyberMind.FR couvre la cybersécurité offensive, le développement noyau Linux, les systèmes embarqués ARM et les technologies open source. Des guides pratiques aux analyses approfondies.
    
    Contributeur au noyau Linux, ambassadeur CrowdSec, ex-Thales, je mets mon expérience terrain au service de la communauté technique.
  expertise:
    - "🔐 Pentesting"
    - "🐧 Linux Kernel"
    - "⚙️ Embedded ARM"
    - "📦 OpenWrt/Armbian"
    - "📡 IoT Security"
    - "📝 Tech Writing"
  stats:
    - value: "35+"
      label: "Ans XP"
    - value: "📝"
      label: "Blog"
    - value: "🌍"
      label: "Savoie & Remote"

